name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        # --ignore-scripts 阻断依赖 postinstall 脚本
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      # 检查依赖漏洞；可在 PR 阶段失败但不阻塞
      - name: Bun audit
        run: bun audit --audit-level high
        continue-on-error: true

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t jcutmirror:ci .
      - name: Boot smoke test
        run: |
          docker run -d --name smoke -p 8080:80 jcutmirror:ci
          # 等待容器启动，检查是否存活
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8080/ -o /dev/null 2>/dev/null; then
              echo "Smoke test passed!"
              docker stop smoke
              exit 0
            fi
            # 容器可能已崩溃退出
            if [ "$(docker inspect -f '{{.State.Running}}' smoke 2>/dev/null)" != "true" ]; then
              echo "Container exited unexpectedly, showing logs:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          echo "Smoke test failed: could not connect after 10s"
          docker logs smoke
          docker stop smoke || true
          exit 1
